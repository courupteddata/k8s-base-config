name: Deploy to LKE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-lke
  cancel-in-progress: false

env:
  INGRESS_NGINX_CHART_VERSION: ""   # e.g. 4.x.y – pin to match your running controller
  CERT_MANAGER_VERSION: v1.15.1     # must match existing static manifests for the first run

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install kubectl
        uses: Azure/setup-kubectl@v5
        with:
          version: latest
          # For a production workflow, pin this to your LKE cluster's
          # Kubernetes version, for example: v1.xx.x

      - name: Set LKE context
        uses: Azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install Helm 4 (latest)
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL -o get-helm-4 \
            https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4
          chmod 700 get-helm-4
          ./get-helm-4

          ver="$(helm version --template '{{.Version}}')"
          echo "Installed Helm ${ver}"

          case "$ver" in
            v4.0.0|v4.0.0+*)
              echo "Helm v4.0.0 has the managedFields adoption bug; need a later 4.x" >&2
              exit 1
              ;;
            v4.*) ;;
            *)
              echo "Expected Helm 4.x, got ${ver}" >&2
              exit 1
              ;;
          esac

      - name: Substitute cert-manager email
        env:
          CERT_EMAIL: ${{ secrets.EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          from pathlib import Path

          email = os.environ["CERT_EMAIL"]

          for filename in (
              "cert-manager/prod_issuer.yaml",
              "cert-manager/staging_issuer.yaml",
          ):
              path = Path(filename)
              path.write_text(
                  path.read_text().replace("email_address_replace_me", email)
              )
          PY

      # Removes only the stored release record (Helm's Secret) when a first
      # install failed. It never touches the cluster resources themselves,
      # so the LoadBalancer Service and its IP are left alone.
      - name: Clear failed first-install release records
        shell: bash
        run: |
          set -euo pipefail

          clear_failed() {
            local release="$1" ns="$2" status
            status="$(helm status "$release" -n "$ns" -o json 2>/dev/null \
              | jq -r '.info.status' || true)"

            case "$status" in
              failed|pending-install)
                if helm history "$release" -n "$ns" -o json \
                    | jq -e 'any(.[]; .status == "deployed" or .status == "superseded")' >/dev/null; then
                  echo "${release} has a previous good revision; leaving history alone"
                else
                  echo "Removing failed release record for ${release} (status: ${status})"
                  kubectl delete secret -n "$ns" \
                    -l "owner=helm,name=${release}" --ignore-not-found
                fi
                ;;
              *)
                echo "${release}: ${status:-not installed}"
                ;;
            esac
          }

          clear_failed ingress-nginx ingress-nginx
          clear_failed cert-manager cert-manager

      # One-time migration: hand ownership of kubectl-applied ingress-nginx
      # resources to Helm. No-op once the release is deployed.
      - name: Adopt existing ingress-nginx resources into Helm
        shell: bash
        run: |
          set -euo pipefail

          status="$(helm status ingress-nginx -n ingress-nginx -o json 2>/dev/null \
            | jq -r '.info.status' || true)"
          if [ "$status" = "deployed" ]; then
            echo "ingress-nginx release already deployed; skipping adoption"
            exit 0
          fi

          RELEASE=ingress-nginx
          RELEASE_NS=ingress-nginx
          SELECTOR=app.kubernetes.io/name=ingress-nginx

          adopt() {
            local kind="$1" scope="$2" names
            if [ "$scope" = "ns" ]; then
              names="$(kubectl get "$kind" -n "$RELEASE_NS" -l "$SELECTOR" -o name 2>/dev/null || true)"
            else
              names="$(kubectl get "$kind" -l "$SELECTOR" -o name 2>/dev/null || true)"
            fi
            [ -n "$names" ] || return 0

            for obj in $names; do
              echo "Adopting ${obj}"
              if [ "$scope" = "ns" ]; then
                kubectl label "$obj" -n "$RELEASE_NS" app.kubernetes.io/managed-by=Helm --overwrite
                kubectl annotate "$obj" -n "$RELEASE_NS" \
                  meta.helm.sh/release-name="$RELEASE" \
                  meta.helm.sh/release-namespace="$RELEASE_NS" --overwrite
              else
                kubectl label "$obj" app.kubernetes.io/managed-by=Helm --overwrite
                kubectl annotate "$obj" \
                  meta.helm.sh/release-name="$RELEASE" \
                  meta.helm.sh/release-namespace="$RELEASE_NS" --overwrite
              fi
            done
          }

          # Namespaced resources
          for kind in serviceaccount configmap role rolebinding service deployment; do
            adopt "$kind" ns
          done

          # Cluster-scoped resources
          for kind in clusterrole clusterrolebinding ingressclass validatingwebhookconfiguration; do
            adopt "$kind" cluster
          done

          # The admission Jobs are immutable; the chart recreates them as hooks.
          kubectl delete job -n "$RELEASE_NS" -l "$SELECTOR" --ignore-not-found

      - name: Install or upgrade ingress-nginx
        shell: bash
        run: |
          set -euo pipefail

          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update ingress-nginx

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            ${INGRESS_NGINX_CHART_VERSION:+--version "$INGRESS_NGINX_CHART_VERSION"} \
            --namespace ingress-nginx \
            --create-namespace \
            --values nginx/values-lke.yaml \
            --force-conflicts \
            --wait \
            --timeout 10m

      # One-time migration: hand ownership of kubectl-applied cert-manager
      # resources to Helm. No-op once the release is deployed or the files are gone.
      - name: Adopt existing cert-manager resources into Helm
        shell: bash
        run: |
          set -euo pipefail

          status="$(helm status cert-manager -n cert-manager -o json 2>/dev/null \
            | jq -r '.info.status' || true)"
          if [ "$status" = "deployed" ]; then
            echo "cert-manager release already deployed; skipping adoption"
            exit 0
          fi

          adopt_file() {
            local release="$1" file="$2" objs count
            [ -f "$file" ] || return 0

            # Only objects that exist in the cluster; skip the Namespace
            # (it isn't part of the chart).
            objs="$(
              kubectl get -f "$file" --ignore-not-found -o json \
                | jq '{apiVersion: "v1", kind: "List", items: [
                        (if .kind == "List" then .items[] else . end)
                        | select(.kind != "Namespace")
                      ]}'
            )"

            count="$(jq '.items | length' <<<"$objs")"
            [ "$count" -gt 0 ] || return 0

            echo "Adopting ${count} objects from ${file} into release ${release}"
            kubectl label -f - app.kubernetes.io/managed-by=Helm --overwrite <<<"$objs"
            kubectl annotate -f - \
              meta.helm.sh/release-name="$release" \
              meta.helm.sh/release-namespace=cert-manager \
              --overwrite <<<"$objs"
          }

          adopt_file cert-manager cert-manager/cert-manager.yaml
          adopt_file cert-manager cert-manager/cert-manager-kube-system.yaml

      - name: Install or upgrade cert-manager
        shell: bash
        run: |
          set -euo pipefail

          helm repo add jetstack https://charts.jetstack.io
          helm repo update jetstack

          helm upgrade --install cert-manager jetstack/cert-manager \
            --version "${CERT_MANAGER_VERSION}" \
            --namespace cert-manager \
            --create-namespace \
            --values cert-manager/values.yaml \
            --force-conflicts \
            --wait \
            --timeout 10m

      - name: Apply cert-manager issuers
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f cert-manager/prod_issuer.yaml \
            -f cert-manager/staging_issuer.yaml

      - name: Deploy example service and Ingress
        shell: bash
        run: |
          set -euo pipefail

          kubectl apply \
            -f example-service/echo.yaml \
            -f example-service/ingress.yaml
