controller:
  ingressClassResource:
    enabled: true
    name: nginx
    default: false

  metrics:
    enabled: false

  config:
    use-proxy-protocol: "true"

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/linode-loadbalancer-default-proxy-protocol: "v1"
      service.beta.kubernetes.io/linode-loadbalancer-hostname-only-ingress: "true"
