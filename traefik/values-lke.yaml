providers:
  # Serve ingress-nginx-style Ingresses (class "nginx", nginx.ingress.kubernetes.io/* annotations)
  kubernetesIngressNginx:
    enabled: true
    ingressClass: nginx
    controllerClass: k8s.io/ingress-nginx
    ingressClassByName: true
  # Off so it can't claim Ingresses first and ignore NGINX annotations
  kubernetesIngress:
    enabled: false

# Don't create Traefik's own "traefik" IngressClass; we use "nginx"
ingressClass:
  enabled: false

service:
  type: LoadBalancer
  spec:
    externalTrafficPolicy: Local
  annotations:
    service.beta.kubernetes.io/linode-loadbalancer-default-proxy-protocol: "v1"
    service.beta.kubernetes.io/linode-loadbalancer-hostname-only-ingress: "true"

# Replaces ingress-nginx's use-proxy-protocol: "true"
# 192.168.255.0/24 is the range Linode NodeBalancers connect from
ports:
  web:
    proxyProtocol:
      trustedIPs:
        - 192.168.255.0/24
  websecure:
    proxyProtocol:
      trustedIPs:
        - 192.168.255.0/24
